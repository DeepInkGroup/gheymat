<style>
  :root {
    --background: #f7f5f0;
    --surface: #ffffff;
    --foreground: #16181c;
    --muted: #6b7078;
    --border: rgba(22, 24, 28, 0.08);
    --up: #16a34a;
    --down: #e11d3f;
    --gold: #B8860B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0b0d10;
      --surface: #14171c;
      --foreground: #f3f4f6;
      --muted: #8b8f98;
      --border: rgba(255, 255, 255, 0.08);
      --up: #34d766;
      --down: #ff5470;
      --gold: #e8b93f;
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--background); color: var(--foreground); margin: 0; touch-action: pan-x pan-y; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  header {
    position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--background) 90%, transparent); backdrop-filter: blur(12px);
  }
  header .inner { max-width: 64rem; margin: 0 auto; display: flex; align-items: center; gap: 0.5rem; height: 3.5rem; padding: 0 1rem; }
  header .brand-text { line-height: 1.2; }
  header .brand-text .name { font-size: 0.9rem; font-weight: 700; }
  header .brand-text .tag { font-size: 0.65rem; color: var(--muted); }
  main { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem; }
  .filters {
    position: sticky; top: 3.5rem; z-index: 10; display: flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--border); border-radius: 1rem; background: var(--background); padding: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .filters .pills { flex: 1; display: flex; gap: 0.5rem; overflow-x: auto; }
  .filters button.pill {
    flex-shrink: 0; border: none; cursor: pointer; border-radius: 999px; padding: 0.4rem 1rem;
    font-size: 0.875rem; font-weight: 500; background: var(--surface); color: var(--muted);
    font-family: inherit;
  }
  .filters button.pill.active { background: var(--foreground); color: var(--background); }
  .settings-btn {
    flex-shrink: 0; border: none; cursor: pointer; background: none; color: var(--muted);
    width: 2rem; height: 2rem; border-radius: 999px; display: flex; align-items: center; justify-content: center;
  }
  .settings-btn:hover { background: var(--surface); color: var(--foreground); }
  section.cat { margin-bottom: 2rem; }
  section.cat h2 { font-size: 0.875rem; font-weight: 600; color: var(--muted); margin: 0 0 0.75rem; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    border: 1px solid var(--border); background: var(--surface); border-radius: 1rem; padding: 1rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .card .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
  .icon { width: 2.5rem; height: 2.5rem; border-radius: 999px; flex-shrink: 0; }
  .icon.flag, .icon.coin { object-fit: cover; border: 1px solid var(--border); }
  .icon.glyph, .icon.gold {
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
    font-size: 0.8rem; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
  }
  .icon.gold svg { width: 1.25rem; height: 1.25rem; }
  .meta { text-align: right; min-width: 0; }
  .meta .name { font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .symbol { font-size: 0.75rem; color: var(--muted); }
  .delta { margin-top: 0.75rem; font-size: 0.75rem; font-weight: 600; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--muted); }
  .price { font-size: 1.25rem; font-weight: 800; }
  @media (min-width: 640px) { .price { font-size: 1.5rem; } }
  .price .unit { margin-left: 0.35rem; font-size: 0.75rem; font-weight: 400; color: var(--muted); }
  footer { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 0.5rem 1rem 2rem; text-align: center; font-size: 0.75rem; color: var(--muted); }
  footer .social { display: flex; gap: 0.75rem; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--foreground); }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 50; align-items: flex-end; justify-content: center;
    background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px);
  }
  .modal-backdrop.open { display: flex; }
  @media (min-width: 640px) { .modal-backdrop { align-items: center; } }
  .modal {
    background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 28rem;
    max-height: 80vh; display: flex; flex-direction: column; border-radius: 1rem 1rem 0 0;
  }
  @media (min-width: 640px) { .modal { border-radius: 1rem; } }
  .modal-head {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; font-size: 0.875rem; font-weight: 600;
  }
  .modal-head button {
    border: none; background: none; cursor: pointer; color: var(--muted); width: 1.75rem; height: 1.75rem;
    border-radius: 999px; font-size: 1rem;
  }
  .modal-head button:hover { background: var(--background); color: var(--foreground); }
  .modal-body { flex: 1; overflow-y: auto; padding: 0.75rem 1rem; }
  .modal-body h3 {
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 1rem 0 0.5rem;
  }
  .modal-body h3:first-child { margin-top: 0; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
    padding: 0.5rem 0.25rem; border-radius: 0.75rem; font-size: 0.875rem;
  }
  .toggle-row:hover { background: var(--background); }
  .switch {
    position: relative; width: 2.75rem; height: 1.5rem; border-radius: 999px; background: var(--border);
    cursor: pointer; flex-shrink: 0; border: none; padding: 0;
  }
  .switch.on { background: var(--up); }
  .switch .knob {
    position: absolute; top: 0.125rem; left: 0.125rem; width: 1.25rem; height: 1.25rem; border-radius: 999px;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.15s;
  }
  .switch.on .knob { transform: translateX(1.25rem); }
  .modal-foot { flex-shrink: 0; border-top: 1px solid var(--border); padding: 0.75rem 1rem; }
  .modal-foot button {
    width: 100%; border: none; cursor: pointer; background: var(--background); color: var(--foreground);
    font-size: 0.875rem; font-weight: 500; padding: 0.6rem; border-radius: 0.75rem; font-family: inherit;
  }

  /* Glassmorphism — activated only when launched as an installed PWA
     (see the standalone-detection script at the end of body). */
  html.standalone {
    --muted: rgba(22, 24, 28, 0.62);
    --border: rgba(255, 255, 255, 0.6);
  }
  html.standalone body {
    background: linear-gradient(160deg, #fdf3e7 0%, #eef1fb 50%, #e9f7f1 100%);
    background-attachment: fixed;
  }
  html.standalone header,
  html.standalone .filters,
  html.standalone .card,
  html.standalone .modal {
    background: rgba(255, 255, 255, 0.6) !important;
    border-color: rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 8px 30px rgba(31, 30, 60, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    html.standalone {
      --muted: rgba(255, 255, 255, 0.68);
      --border: rgba(255, 255, 255, 0.16);
    }
    html.standalone body {
      background: linear-gradient(160deg, #0b0d10 0%, #171335 50%, #06232f 100%);
      background-attachment: fixed;
    }
    html.standalone header,
    html.standalone .filters,
    html.standalone .card,
    html.standalone .modal {
      background: rgba(38, 38, 48, 0.55) !important;
      border-color: rgba(255, 255, 255, 0.14) !important;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
  }
  /* Web-only chrome has no place in an installed app. */
  html.standalone footer {
    display: none !important;
  }
  @supports (padding: max(0px)) {
    html.standalone header {
      padding-top: max(env(safe-area-inset-top), 0px);
    }
  }
</style>
</head>

  function iconHtml(icon) {
    if (icon.type === "flag") return '<img class="icon flag" src="flags/' + icon.file + '.svg" alt="" />';
    if (icon.type === "coin") return '<img class="icon coin" src="crypto/' + icon.file + '.svg" alt="" />';
    if (icon.type === "gold") {
      return '<span class="icon gold" style="background:var(--gold)"><svg viewBox="0 0 24 24" fill="none">' + GOLD_GLYPHS[icon.kind] + '</svg></span>';
    }
    return '<span class="icon glyph" style="background:' + icon.color + '">' + icon.text + '</span>';
  }

  function arrow(dir) { return dir === "up" ? "&#9650; " : dir === "down" ? "&#9660; " : ""; }

  // ---- Hidden-instruments preference (localStorage) ----
  var STORAGE_KEY = "gheymat:hidden-symbols";
  // First-time default: only Tether and Bitcoin shown in Crypto.
  var DEFAULT_HIDDEN = ITEMS.filter(function (i) {
    return i.category === "crypto" && i.symbol !== "USDT" && i.symbol !== "BITCOIN";
  }).map(function (i) { return i.symbol; });

  function readHidden() {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) return DEFAULT_HIDDEN;
    try {
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : DEFAULT_HIDDEN;
    } catch (e) { return DEFAULT_HIDDEN; }
  }
  var hidden = {};
  readHidden().forEach(function (s) { hidden[s] = true; });
  function persistHidden() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.keys(hidden))); } catch (e) {}
  }

  var currentFilter = "all";

  function render() {
    var board = document.getElementById("board");
    var empty = document.getElementById("emptyState");
    board.innerHTML = "";
    var cats = currentFilter === "all" ? CATEGORIES : [currentFilter];
    var any = false;
    cats.forEach(function (cat) {
      var items = ITEMS.filter(function (i) { return i.category === cat && !hidden[i.symbol]; });
      if (!items.length) return;
      any = true;
      var section = document.createElement("section");
      section.className = "cat";
      var h2 = document.createElement("h2");
      h2.textContent = CATEGORY_LABELS[cat];
      section.appendChild(h2);
      var grid = document.createElement("div");
      grid.className = "grid";
      items.forEach(function (item) {
        var card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          '<div class="top">' + iconHtml(item.icon) +
          '<div class="meta"><div class="name">' + item.name + '</div><div class="symbol num">' + item.symbol + '</div></div></div>' +
          '<div class="delta num ' + item.dir + '">' + arrow(item.dir) + item.delta + '</div>' +
          '<div class="price num">' + item.price + '<span class="unit">' + item.unit + '</span></div>';
        grid.appendChild(card);
      });
      section.appendChild(grid);
      board.appendChild(section);
    });
    empty.style.display = any ? "none" : "block";
  }

  document.getElementById("filters").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    document.querySelectorAll("#filters .pill").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    currentFilter = btn.getAttribute("data-filter");
    render();
  });
  document.querySelector('[data-filter="all"]').classList.add("active");

  render();

  // ---- Settings panel ----
  var backdrop = document.getElementById("modalBackdrop");
  var modalBody = document.getElementById("modalBody");

  function renderModal() {
    modalBody.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var h3 = document.createElement("h3");
      h3.textContent = CATEGORY_LABELS[cat];
      modalBody.appendChild(h3);
      ITEMS.filter(function (i) { return i.category === cat; }).forEach(function (item) {
        var row = document.createElement("div");
        row.className = "toggle-row";
        var visible = !hidden[item.symbol];
        row.innerHTML =
          '<span>' + item.name + '</span>' +
          '<button class="switch' + (visible ? ' on' : '') + '" data-symbol="' + item.symbol + '" role="switch" aria-checked="' + visible + '"><span class="knob"></span></button>';
        modalBody.appendChild(row);
      });
    });
  }

  function openModal() {
    renderModal();
    backdrop.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeModal() {
    backdrop.classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("settingsBtn").addEventListener("click", openModal);
  document.getElementById("modalClose").addEventListener("click", closeModal);
  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });
  modalBody.addEventListener("click", function (e) {
    var btn = e.target.closest(".switch");
    if (!btn) return;
    var symbol = btn.getAttribute("data-symbol");
    if (hidden[symbol]) delete hidden[symbol];
    else hidden[symbol] = true;
    persistHidden();
    btn.classList.toggle("on");
    btn.setAttribute("aria-checked", String(!hidden[symbol]));
    render();
  });
  document.getElementById("showAllBtn").addEventListener("click", function () {
    hidden = {};
    persistHidden();
    renderModal();
    render();
  });

  // Standalone PWA detection — flips on the glass theme and hides web-only chrome.
  var isStandalone =
    window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (isStandalone) {
    document.documentElement.classList.add("standalone");
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
</script>
</body>
</html>
